<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El blog del Treile</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Estilos Treile -->
    <link rel="stylesheet" href="./assets/css/treile.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/img/brand/patita-roja-32x32.png"
    />
  </head>

  <body class="page-blog">
    <div data-include="navbar"></div>

    <!-- CONTENIDO -->
    <main class="container my-5">
      <!-- Cabecera del Blog -->
      <header class="text-center mb-4">
        <img
          src="./assets/img/brand/isologotipo-ilustrado-sin-fondo-amarillo.png"
          alt="Isologotipo de Treile Café"
          class="img-fluid mb-3"
          style="max-width: 220px"
        />
        <!-- <p class="menu-hero-subtitle mb-1">HISTORIAS DESDE TREILE</p> -->
        <h1 class="display-6 fw-semibold" style="color: var(--treile-amarillo);">
          El blog del Treile
        </h1>
       <!-- <p class="small mt-2">
          Noticias del barrio, recomendaciones de café, música y vida cotidiana en Pucón.
        </p>--> 
      </header>

      <!-- Filtros (búsqueda simple) -->
      <section class="row mb-4">
        <div class="col-md-6 mb-2">
          <input
            type="text"
            id="searchInput"
            class="form-control form-control-sm"
            placeholder="Buscar en el blog (ej: café, música, invierno)..."
          />
        </div>
        <div class="col-md-6 mb-2 text-md-end">
          <select id="filterCategory" class="form-select form-select-sm w-auto d-inline">
            <option value="all">Todas las categorías</option>
            <option value="cafe">Café</option>
            <option value="musica">Música</option>
            <option value="barrio">Barrio</option>
            <option value="eventos">Eventos</option>
          </select>
        </div>
      </section>

      <!-- Aquí se inyectan las tarjetas del blog -->
      <section id="blogPosts" class="row g-4">
        <!-- JS pintará las tarjetas acá -->
      </section>
    </main>

    <div data-include="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/includes.js"></script>
    <!-- Datos compartidos del blog -->
    <script src="./assets/js/postsData.js"></script>
    <!-- Lógica del Blog -->
    <script src="./assets/js/blog.js"></script>
  </body>
</html>
