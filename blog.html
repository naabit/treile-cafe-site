<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Treile Café | Blog</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts (mismas del resto del sitio) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Oswald:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos Treile -->
    <link rel="stylesheet" href="treile.css" />
  </head>

  <body>
    <!-- NAVBAR (mismo estilo que index y menú) -->
    <nav class="navbar navbar-expand-lg navbar-treile sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TREILE</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Alternar navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Menú</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="blog.html">Blog</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="container my-5">
      <!-- Cabecera del Blog -->
      <header class="text-center mb-4">
        <p class="menu-hero-subtitle mb-1">HISTORIAS DESDE TREILE</p>
        <h1 class="display-6 fw-semibold" style="color: var(--treile-rojo);">
          Blog de Treile Café
        </h1>
        <p class="small mt-2">
          Noticias del barrio, recomendaciones de café, música y vida cotidiana en Pucón.
        </p>
      </header>

      <!-- Filtros (búsqueda simple) -->
      <section class="row mb-4">
        <div class="col-md-6 mb-2">
          <input
            type="text"
            id="searchInput"
            class="form-control form-control-sm"
            placeholder="Buscar en el blog (ej: café, música, invierno)..."
          />
        </div>
        <div class="col-md-6 mb-2 text-md-end">
          <select id="filterCategory" class="form-select form-select-sm w-auto d-inline">
            <option value="all">Todas las categorías</option>
            <option value="cafe">Café</option>
            <option value="musica">Música</option>
            <option value="barrio">Barrio</option>
            <option value="eventos">Eventos</option>
          </select>
        </div>
      </section>

      <!-- Aquí se inyectan las tarjetas del blog -->
      <section id="blogPosts" class="row g-4">
        <!-- JS pintará las tarjetas acá -->
      </section>
    </main>

    <footer>
      <div class="container text-center">
        <small>Treile Café · Pucón · Proyecto demo para portafolio Naabit</small>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Datos compartidos del blog -->
    <script src="./assets/js/postsData.js"></script>
    <!-- Lógica del Blog -->
    <script src="./assets/js/blog.js"></script>
  </body>
</html>
